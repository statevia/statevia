version: 1

workflow:
  id: capacity.l3.delayWait
  name: CapacityL3DelayWait
  description: Capacity harness L3 probe. wait.timeout is unused in current Loader; DelayWait is not HTTP-authorable.

nodes:
  - name: flow.start
    type: start
    label: start
    next: flow.wait

  - name: flow.wait
    type: wait
    label: wait
    timeout: PT2S
    events:
      go: flow.noop

  - name: flow.noop
    type: action
    label: noop
    action: statevia.action.builtin.execution.noop
    next: flow.end

  - name: flow.end
    type: end
    label: end
