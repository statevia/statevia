# C# 横断 Serena プロジェクト（mcp.json の serena-csharp / --project はリポジトリルート）。
# C# 言語サーバーは先頭の statevia.sln を開く。コンポーネント別 .serena/ は切り戻し用に残す。
project_name: "csharp"

encoding: "utf-8"

line_ending:

language_backend:

ignore_all_files_in_gitignore: true

ls_specific_settings: {}

# プロダクト C# に関連しないパスを除外する。
# UI は serena-ui、ドキュメント・運用スクリプト・サンプル・Fixture・生成物は対象外。
# テスト本体（*.Tests、tests/）はプロダクト契約の検証なので残す。
ignored_paths:
  - "ui/**"
  - "docs/**"
  - "sonar/**"
  - "scripts/**"
  - ".spec/**"
  - ".cursor/**"
  - ".claude/**"
  - ".vscode/**"
  - ".github/**"
  - ".local/**"
  - ".sonarqube/**"
  - ".sonarlint/**"
  - ".scannerwork/**"
  - "docker-compose*.yml"
  - "**/Dockerfile"
  - "core/engine/samples/**"
  - "**/Fixtures/**"
  - "modules/default/**"
  - "service/api/openapi/**"
  - "**/bin/**"
  - "**/obj/**"
  - "**/node_modules/**"
  - "coverage/**"
  - "docs/out/**"

read_only: false

excluded_tools: []

included_optional_tools: []

fixed_tools: []

default_modes:

added_modes:

initial_prompt: ""

symbol_info_budget:

read_only_memory_patterns: []

ignored_memory_patterns: []

ls_additional_workspace_folders: []

language_servers:
  - csharp

# プロダクト C# のソースツリーだけを Serena シンボル索引の対象にする。
ls_workspace_folders:
  - core/engine
  - core/application
  - core/actions
  - infrastructure
  - service/api
  - service/runtime
  - service/action-host
  - service/cli
  - modules/reference
  - tests

activation_command:

activation_command_timeout: 180.0
