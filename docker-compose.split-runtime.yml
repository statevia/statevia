# ランタイム分離: API 内 HostedService を Off し、scheduler / worker を起動する。
# 使い方:
#   docker compose -f docker-compose.yml -f docker-compose.split-runtime.yml up -d
# 戻すとき:
#   docker compose -f docker-compose.yml -f docker-compose.split-runtime.yml down
#   docker compose up -d
services:
  service-api:
    environment:
      Statevia__Runtime__EnableInProcessWorker: "false"
      Statevia__Runtime__EnableInProcessDelayWaitScheduler: "false"
      Statevia__Runtime__EnableInProcessOwnershipRecovery: "false"

  scheduler:
    build:
      context: .
      dockerfile: service/runtime/Statevia.Service.Runtime.Scheduler/Dockerfile
    environment:
      # Generic Host は DOTNET_ENVIRONMENT。ランタイムイメージ既定 Production をローカルでは API と同じ Development に揃える。
      DOTNET_ENVIRONMENT: Development
      ASPNETCORE_ENVIRONMENT: Development
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    depends_on:
      - postgres

  worker:
    build:
      context: .
      dockerfile: service/runtime/Statevia.Service.Runtime.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ASPNETCORE_ENVIRONMENT: Development
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      Statevia__ActionHost__BaseUrl: "http://action-host:5001"
      # 未設定時は 4 / 1。格子計測は STATEVIA_WORKER_* と --scale worker=N（container_name なし）。
      Statevia__Runtime__Worker__MaxConcurrency: ${STATEVIA_WORKER_MAX_CONCURRENCY:-4}
      Statevia__Runtime__Worker__CancelConcurrency: ${STATEVIA_WORKER_CANCEL_CONCURRENCY:-1}
      Statevia__Runtime__Worker__NoProgressTimeout: 00:10:00
    depends_on:
      - postgres
      - action-host
    volumes:
      - ./modules:/app/modules
