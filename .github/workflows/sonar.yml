name: Sonar

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 同じ ref の新しい push が来たら、進行中の解析は打ち切る。
concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Select projects
    runs-on: ubuntu-latest
    outputs:
      has_work: ${{ steps.filter.outputs.has_work }}
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin ${{ github.event.pull_request.base.sha }}

      - name: Select Sonar projects
        id: filter
        shell: pwsh
        env:
          SONAR_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
          SONAR_DIFF_HEAD: ${{ github.sha }}
        run: ./sonar/select-sonar-projects.ps1

  sonar:
    name: Analyze ${{ matrix.id }}
    needs: changes
    if: >-
      needs.changes.outputs.has_work == 'true' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.matrix) }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_ORGANIZATION: statevia
      # 初回の main 解析はベースラインに使う。Quality Gate 待ちは PR だけ。
      SONAR_QUALITYGATE_WAIT: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      # シナリオは Docker 前提で、カバレッジ対象外。dotnet test へ渡すフィルタはスキャナ側。
      STATEVIA_SKIP_SCENARIO_TESTS: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.node
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/studio/package-lock.json

      - name: Install Sonar tools
        if: ${{ !matrix.node }}
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-coverage
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Install UI dependencies
        if: matrix.node
        working-directory: ui/studio
        # esbuild の実行ファイルは optional dependency として入る。lifecycle script は走らせない。
        run: npm ci --ignore-scripts

      - name: Analyze
        shell: pwsh
        run: ${{ matrix.script }}
