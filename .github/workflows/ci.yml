name: CI

# PR ブランチは pull_request だけで検証する。push も拾うと同じコミットで 2 回走る。
on:
  push:
    branches:
      - main
  pull_request:

# 同じ ref の新しい push が来たら、進行中の検証は打ち切る。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-tests:
    name: Architecture tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Run architecture tests
        run: dotnet test tests/Statevia.Architecture.Tests/Statevia.Architecture.Tests.csproj --configuration Release --verbosity minimal

  docs-link-check:
    name: Docs link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # nodejs は glob にすると node_modules まで拾うので、README を名指しする。
      - name: Check internal links in docs and READMEs
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --config .lychee.toml --no-progress
            'docs/**/*.md'
            'README.md'
            'dotnet/**/README.md'
            'nodejs/studio/e2e/README.md'
            'scripts/**/README.md'

  # docs/ のメタブロック（種別・Version・更新日）を検査する。書式の正本は docs/DOCUMENTATION-STANDARD.md。
  docs-meta-check:
    name: Docs meta check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # scripts/docs の検査（メタブロック・画面の一覧）の単体テスト。ジョブ名は必須チェックの名前を変えないため据え置く。
      - name: Test the docs checkers
        run: node --test "scripts/docs/__tests__/*.test.mjs"

      - name: Check docs meta blocks
        run: node scripts/docs/check-doc-meta.mjs

      # Studio の画面（nodejs/studio/app/**/page.tsx）と ui-user-guide.md の「画面の一覧」を突き合わせる。
      - name: Check UI guide screen list
        run: node scripts/docs/check-ui-routes.mjs

  format-check:
    name: C# format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Verify C# format
        shell: pwsh
        run: ./scripts/dotnet-format-all.ps1 -VerifyNoChanges -Verbosity minimal

  # Studio（nodejs/studio）とこのワークフローに変更があるかを判定する。UI のジョブはこの結果で動かすかを決める。
  # 差分を取れないとき（main の初回 push や、force push で基点が消えたとき）は変更ありとして扱う。
  studio-changes:
    name: Detect Studio changes
    runs-on: ubuntu-latest
    outputs:
      studio: ${{ steps.filter.outputs.studio }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # PR は base と merge コミットの差分、main への push は push 前後の差分を見る。
      - name: Diff against base
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "studio=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! changed_files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA"); then
            echo "差分を取れなかったので、変更ありとして扱う。"
            echo "studio=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$changed_files" | grep -qE '^(nodejs/studio/|\.github/workflows/ci\.yml$)'; then
            echo "studio=true" >> "$GITHUB_OUTPUT"
          else
            echo "studio=false" >> "$GITHUB_OUTPUT"
          fi

  # 必須チェックなので、ジョブの if でスキップする（スキップは成功として扱われる）。
  # 判定のジョブが失敗したときは、黙ってスキップせずに動かす。
  ui-lint-typecheck:
    name: UI lint and typecheck
    needs: studio-changes
    if: ${{ !cancelled() && (needs.studio-changes.result != 'success' || needs.studio-changes.outputs.studio == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodejs/studio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nodejs/studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  # Studio の E2E（Playwright）の mock project だけを回す。ブラウザで API をモックするので Service API は要らない。
  # 実 API の project（real-api）は回さない（studio-e2e-foundation の U2=A）。環境変数が無いので project ごと定義されない。
  ui-e2e-mock:
    name: UI E2E (mock)
    needs: ui-lint-typecheck
    # lint が動いて成功したときだけ動く。lint がスキップされたら E2E もスキップされる。
    if: ${{ !cancelled() && needs.ui-lint-typecheck.result == 'success' }}
    # ubuntu-latest（26.04）には Playwright 1.58 が Chromium を入れられないので 24.04 に固定する。
    # Playwright を 26.04 に対応した版へ上げたら ubuntu-latest に戻す。
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nodejs/studio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nodejs/studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ブラウザのキャッシュは Playwright の版ごとに分ける（版が変わるとブラウザの版も変わる）。
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Chromium with system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # キャッシュはブラウザの本体だけなので、OS のライブラリは毎回入れる。
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # CI では playwright.config.ts が worker 1・再試行 2・test.only の禁止・既存サーバーの再利用なしになる。
      - name: Run E2E (mock)
        run: npx playwright test --project=mock

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-mock
          path: |
            nodejs/studio/playwright-report/
            nodejs/studio/test-results/
          retention-days: 7

  # 文書のスクリーンショット（README と UI ガイドの画像）が撮れることを確かめる。
  # 架空データのモックで撮るので Service API は要らない。画像はコミットせず、差分も比べない（docs-readme-refresh の U2=A）。
  # 撮れた画像は成果物に残し、レビューで画面の写りを見られるようにする。
  docs-screenshots-check:
    name: Docs screenshots check
    needs: ui-lint-typecheck
    if: ${{ !cancelled() && needs.ui-lint-typecheck.result == 'success' }}
    # ui-e2e-mock と同じ理由で 24.04 に固定する。
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nodejs/studio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nodejs/studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Chromium with system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # 応答の書き忘れ（モックしていない API の呼び出し）、画面の壊れ、200KB の超過で失敗する。
      - name: Take docs screenshots
        run: npm run docs:screenshots

      - name: Upload screenshots
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-screenshots
          path: docs/images/screenshots/
          retention-days: 7

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-screenshots-results
          path: nodejs/studio/test-results/
          retention-days: 7

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # .spec/specs などは gitignore。checkout 上は templates / steering のみ。
      # README はリポジトリの各所にあるので、node_modules と .NET のビルド出力を除いて拾う。
      - name: Lint docs, spec and README markdown
        run: >-
          npx --yes markdownlint-cli2
          "docs/**/*.md" ".spec/**/*.md"
          "README.md" "dotnet/**/README.md" "nodejs/**/README.md" "scripts/**/README.md"
          "#**/node_modules/**" "#**/bin/**" "#**/obj/**"
