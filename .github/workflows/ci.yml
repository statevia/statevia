name: CI

# PR ブランチは pull_request だけで検証する。push も拾うと同じコミットで 2 回走る。
on:
  push:
    branches:
      - main
  pull_request:

# 同じ ref の新しい push が来たら、進行中の検証は打ち切る。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-tests:
    name: Architecture tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Run architecture tests
        run: dotnet test tests/Statevia.Architecture.Tests/Statevia.Architecture.Tests.csproj --configuration Release --verbosity minimal

  docs-link-check:
    name: Docs link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check internal links in docs
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config .lychee.toml --no-progress 'docs/**/*.md'

  format-check:
    name: C# format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Verify C# format
        shell: pwsh
        run: ./scripts/dotnet-format-all.ps1 -VerifyNoChanges -Verbosity minimal

  ui-lint-typecheck:
    name: UI lint and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodejs/studio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nodejs/studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # .spec/specs などは gitignore。checkout 上は templates / steering のみ。
      - name: Lint docs and spec markdown
        run: npx --yes markdownlint-cli2 "docs/**/*.md" ".spec/**/*.md"
