[SERVICE]
    Flush           1
    Daemon          Off
    Log_Level       info
    Parsers_File    parsers.conf
    HTTP_Server     Off

[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224
    Buffer_Chunk_Size 1M
    Buffer_Max_Size   6M

[FILTER]
    Name          parser
    Match         service-api
    Key_Name      log
    Parser        json
    Reserve_Data  On
    Preserve_Key  On

[FILTER]
    Name          parser
    Match         action-host
    Key_Name      log
    Parser        json
    Reserve_Data  On
    Preserve_Key  On

[FILTER]
    Name          parser
    Match         worker
    Key_Name      log
    Parser        json
    Reserve_Data  On
    Preserve_Key  On

[FILTER]
    Name          parser
    Match         scheduler
    Key_Name      log
    Parser        json
    Reserve_Data  On
    Preserve_Key  On

[FILTER]
    Name    lua
    Match   service-api
    script  /fluent-bit/etc/orgid.lua
    call    set_org_id

[FILTER]
    Name    lua
    Match   action-host
    script  /fluent-bit/etc/orgid.lua
    call    set_org_id

[FILTER]
    Name    lua
    Match   worker
    script  /fluent-bit/etc/orgid.lua
    call    set_org_id

[FILTER]
    Name    lua
    Match   scheduler
    script  /fluent-bit/etc/orgid.lua
    call    set_org_id

# Loki 出力は Org ごとに別インスタンス。ops とテナント UUID を同一フラッシュに載せない。
[FILTER]
    Name          rewrite_tag
    Match         service-api
    Rule          $org_id ^statevia-ops$ org.statevia-ops false
    Rule          $org_id ^(.+)$ tid.$1 false
    Emitter_Name  org_split_api

[FILTER]
    Name          rewrite_tag
    Match         action-host
    Rule          $org_id ^statevia-ops$ org.statevia-ops false
    Rule          $org_id ^(.+)$ tid.$1 false
    Emitter_Name  org_split_host

[FILTER]
    Name          rewrite_tag
    Match         worker
    Rule          $org_id ^statevia-ops$ org.statevia-ops false
    Rule          $org_id ^(.+)$ tid.$1 false
    Emitter_Name  org_split_worker

[FILTER]
    Name          rewrite_tag
    Match         scheduler
    Rule          $org_id ^statevia-ops$ org.statevia-ops false
    Rule          $org_id ^(.+)$ tid.$1 false
    Emitter_Name  org_split_scheduler

[OUTPUT]
    Name            loki
    Match           org.statevia-ops
    Host            loki
    Port            3100
    Labels          job=statevia
    label_keys      $service
    tenant_id       statevia-ops
    line_format     json
    Retry_Limit     5

[OUTPUT]
    Name            loki
    Match           tid.*
    Host            loki
    Port            3100
    Labels          job=statevia
    label_keys      $service
    tenant_id_key   org_id
    line_format     json
    Retry_Limit     5
