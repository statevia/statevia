apiVersion: 1

datasources:
  - name: statevia-ops
    uid: statevia-ops
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: statevia-ops

  # Development シード（tenant_key=default）。他テナントは手で足す。
  - name: statevia-tenant-default
    uid: statevia-tenant-default
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: 00000000-0000-4000-8000-000000000001

  - name: statevia-postgres
    uid: statevia-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: $POSTGRES_USER
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 4
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: $POSTGRES_PASSWORD
