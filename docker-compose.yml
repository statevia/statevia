# v2: engine (C#), service-api (C# ASP.NET Core), ui-studio (Next.js/TS)
# 初回: cp .env.example .env（POSTGRES_*）。マイグレーションは docs/operations-docker.md を参照services:
services:
  postgres:
    container_name: statevia-postgres
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # C# API は EF Core マイグレーションでスキーマ作成するため init SQL は不要

  service-api:
    container_name: statevia-service-api
    build:
      context: ./dotnet
      dockerfile: service/api/Dockerfile
    environment:
      # ローカル compose は Development（OpenAPI / Scalar を /scalar/v1 で公開）。本番イメージ単体では Production のまま。
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      # appsettings の BaseUrl を空にして、Endpoints と併記しない。
      Statevia__ActionHost__BaseUrl: ""
      Statevia__ActionHost__Endpoints__0: "http://action-host-1:5001"
      Statevia__ActionHost__Endpoints__1: "http://action-host-2:5001"
      # 既定は API 内 HostedService On。分離は docker-compose.split-runtime.yml を追加する。
      Statevia__Runtime__EnableInProcessWorker: "true"
      Statevia__Runtime__EnableInProcessDelayWaitScheduler: "true"
      Statevia__Runtime__EnableInProcessOwnershipRecovery: "true"
      Statevia__Runtime__EnableInProcessScheduleDispatcher: "true"
      # 未設定・空ならエラー監視 SDK は動かない。受信側は製品 compose に含めない。
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      - postgres
      - action-host-1
      - action-host-2
    # プロセスが /v1/health に応答することだけを見る。データベースへの到達は見ない。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    ports:
      - "8080:8080"
    volumes:
      # Action Module 配置（ホスト ./modules → コンテナ既定ルート /app/modules）
      - ./modules:/app/modules

  action-host-1:
    container_name: statevia-action-host-1
    build:
      context: ./dotnet
      dockerfile: service/action-host/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5001"
      STATEVIA_MODULES_PATH: "/app/modules"
    ports:
      - "5001:5001"
    volumes:
      # Module の配置は service-api が書く。Action Host からは置き換えられないように読み取り専用。
      - ./modules:/app/modules:ro

  action-host-2:
    container_name: statevia-action-host-2
    build:
      context: ./dotnet
      dockerfile: service/action-host/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5001"
      STATEVIA_MODULES_PATH: "/app/modules"
    ports:
      - "5002:5001"
    volumes:
      - ./modules:/app/modules:ro

  ui-studio:
    container_name: statevia-ui-studio
    build:
      context: nodejs/studio
    environment:
      SERVICE_API_INTERNAL_BASE: "http://service-api:8080"
    ports:
      - "3000:3000"
    depends_on:
      service-api:
        condition: service_healthy

volumes:
  pgdata: {}
