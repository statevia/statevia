# v2: engine (C#), service-api (C# ASP.NET Core), ui-studio (Next.js/TS)
# 初回: cp .env.example .env（POSTGRES_*）。マイグレーションは docs/operations-docker.md を参照services:
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # C# API は EF Core マイグレーションでスキーマ作成するため init SQL は不要

  service-api:
    build:
      context: .
      dockerfile: service/api/Dockerfile
    environment:
      # ローカル compose は Development（OpenAPI / Scalar を /scalar/v1 で公開）。本番イメージ単体では Production のまま。
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      Statevia__ActionHost__BaseUrl: "http://action-host:5001"
      # 既定は API 内 HostedService On。分離は docker-compose.split-runtime.yml を追加する。
      Statevia__Runtime__EnableInProcessWorker: "true"
      Statevia__Runtime__EnableInProcessDelayWaitScheduler: "true"
      Statevia__Runtime__EnableInProcessOwnershipRecovery: "true"
      Statevia__Runtime__EnableInProcessScheduleDispatcher: "true"
      # 未設定・空ならエラー監視 SDK は動かない。受信側は製品 compose に含めない。
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      - postgres
      - action-host
    # プロセスが /v1/health に応答することだけを見る。データベースへの到達は見ない。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    ports:
      - "8080:8080"
    volumes:
      # Action Module 配置（ホスト ./modules → コンテナ既定ルート /app/modules）
      - ./modules:/app/modules

  action-host:
    build:
      context: .
      dockerfile: service/action-host/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5001"
      STATEVIA_MODULES_PATH: "/app/modules"
    ports:
      - "5001:5001"
    volumes:
      - ./modules:/app/modules

  ui-studio:
    build:
      context: ui/studio
    environment:
      SERVICE_API_INTERNAL_BASE: "http://service-api:8080"
    ports:
      - "3000:3000"
    depends_on:
      service-api:
        condition: service_healthy

volumes:
  pgdata: {}
