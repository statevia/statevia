# 任意: JSON stdout と Fluent Bit / Loki / Grafana を別コンテナで起動する。
# 使い方:
#   docker compose -f docker-compose.yml -f docker-compose.logging.yml up -d
# ランタイム分離と併用（Worker / Scheduler にも JsonConsole と fluentd を付ける）:
#   docker compose -f docker-compose.yml -f docker-compose.split-runtime.yml \
#     -f docker-compose.logging.yml -f docker-compose.logging-split.yml up -d
# 戻すとき:
#   docker compose -f docker-compose.yml -f docker-compose.logging.yml down
#   docker compose up -d
#
# 既定の docker-compose.yml には Loki / Grafana / Fluent Bit を埋め込まない。
# Studio / PostgreSQL は収集対象外。
# fluentd ドライバは Docker デーモンから接続する。不通なら STATEVIA_FLUENTD_ADDRESS を host.docker.internal:24224 にする。
# Worker / Scheduler を本ファイルに書くと、split-runtime 無しでは image が無く compose が失敗するため logging-split.yml に分けている。

x-fluentd-logging: &fluentd-logging
  driver: fluentd
  options: &fluentd-options
    fluentd-address: ${STATEVIA_FLUENTD_ADDRESS:-localhost:24224}
    fluentd-async: "true"
    fluentd-retry-wait: "1s"
    fluentd-max-retries: "30"
    fluentd-sub-second-precision: "true"

services:
  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./compose/logging/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  fluent-bit:
    image: fluent/fluent-bit:3.2.10
    command: ["-c", "/fluent-bit/etc/fluent-bit.conf"]
    volumes:
      - ./compose/logging/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./compose/logging/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ./compose/logging/orgid.lua:/fluent-bit/etc/orgid.lua:ro
    ports:
      - "24224:24224"
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_USERS_DEFAULT_LANGUAGE: ja-JP
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "3001:3000"
    volumes:
      - ./compose/logging/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
      - postgres
    restart: unless-stopped

  service-api:
    environment:
      Logging__Console__FormatterName: json
      Logging__Console__FormatterOptions__IncludeScopes: "true"
    logging:
      <<: *fluentd-logging
      options:
        <<: *fluentd-options
        tag: service-api
    depends_on:
      - fluent-bit

  action-host:
    environment:
      Logging__Console__FormatterName: json
      Logging__Console__FormatterOptions__IncludeScopes: "true"
    logging:
      <<: *fluentd-logging
      options:
        <<: *fluentd-options
        tag: action-host
    depends_on:
      - fluent-bit

volumes:
  loki-data: {}
