# ============================================================
# SonarQube Cloud - statevia_statevia_ui
# host / organization / token は sonar/sonar-scanner-ui.ps1 が渡す。
# このファイルに host を書くと、ローカル Community Build への上書きが残る。
# ============================================================
sonar.projectKey=statevia_statevia_ui
sonar.projectName=Statevia UI Studio

# ---- Sources --------------------------------------------
# 品質ゲート対象はプロダクションコードのみ。C# の excludeTestProjects と同趣旨で
# tests/ は解析に送らない（lcov は app / features / shared / middleware を指す）。
# sonar.issue.ignore.allfile はファイル本文の正規表現であり、パス除外には使えない。
sonar.sources=app,features,shared,middleware.ts
sonar.sourceEncoding=UTF-8

# ---- TypeScript -----------------------------------------
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# ---- Exclusions -----------------------------------------
sonar.exclusions=\
  node_modules/**,\
  .next/**,\
  coverage/**,\
  tests/**,\
  e2e/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.config.ts

# ---- Coverage Exclusions --------------------------------
# 方針: vitest.config.ts の coverage.exclude と同一セット（正本: .spec/archive/specs/ui-quality-refactor/sonar-scan-results.md）
# 除外しても tests/ のスモーク・単体で主要経路は固定する。ロジックは app/lib・app/features・shared を計測対象とする。
#
# | パターン | 除外理由 |
# | **/*.test.ts(x), **/*.config.ts | テストコード・ビルド設定（実行対象アプリではない） |
# | shared/i18n/uiText.ts, uiText.en.ts | i18n 文言データ（分岐・ビジネスロジックなし） |
# | shared/api/apiError.ts, shared/auth/authMe.ts | 型定義のみ（実行時コードなし） |
# | app/lib/types.ts, app/graphs/types.ts | 型定義のみ（実行時コードなし） |
# | app/layout.tsx | Next.js ルートレイアウト（cookies / メタデータ。サーバー専用） |
# | app/**/page.tsx | ルート薄ラッパー（*PageClient へ委譲のみ） |
# | DefinitionGraphEditor, Yaml/ActionInput CodeEditor | CodeMirror / React Flow 依存 UI（tests/components/editor でスモーク） |
# | ExecutionDashboard, DefinitionEditorPageClient | 画面統合 UI（tests/ のページ・Client スモークで経路固定） |
# | NodeGraphView | React Flow 実行グラフ（tests/components/nodes/NodeGraphView.test.tsx） |
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.config.ts,\
  shared/i18n/uiText.ts,\
  shared/i18n/uiText.en.ts,\
  shared/api/apiError.ts,\
  shared/auth/authMe.ts,\
  shared/ui/ActionInputCodeEditor.tsx,\
  features/definitions/i18n/**,\
  app/lib/types.ts,\
  app/graphs/types.ts,\
  app/layout.tsx,\
  app/**/page.tsx,\
  features/definition-editor/ui/DefinitionGraphEditor.tsx,\
  features/definition-editor/ui/YamlCodeEditor.tsx,\
  features/executions/ui/ExecutionDashboard.tsx,\
  features/definition-editor/ui/DefinitionEditorPageClient.tsx,\
  features/executions/ui/NodeGraphView.tsx

# ---- CPD Exclusions -------------------------------------
# i18n 文言データは locale 間で意図的に同一構造を持つため CPD 対象外（coverage 除外と同趣旨）
sonar.cpd.exclusions=\
  shared/i18n/uiText.ts,\
  shared/i18n/uiText.en.ts,\
  shared/i18n/actionCatalogUiText.ts

# ---- Issue Exclusions -----------------------------------
# i18n は画面文言である。パスワードという語はラベルであり、資格情報は置かない。
# S2068 はプロパティ名や「パスワード」をハードコード資格情報と誤検知する。
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.e1.resourceKey=**/i18n/**
